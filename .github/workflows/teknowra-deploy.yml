# TeKnowra 自有部署流水线：push main → 构建 app / ui 镜像 → 推 Docker Hub。
#
# 服务器在办公室内网（192.168.0.224），GitHub 连不进去，所以这里只负责「构建 + 推送」。
# 上线由服务器上的 watchtower 完成：定时轮询 Docker Hub，发现 :latest 更新就经
# daocloud 加速器拉取并重建 WeKnora-app / WeKnora-frontend 容器。
#
# 文件名带 teknowra- 前缀，和上游 workflow 区分，同步 upstream 不冲突。
# 需要仓库 Secret：DOCKERHUB_TOKEN（Docker Hub Read & Write 访问令牌）。
name: teknowra-deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

# 连续 push 只保留最后一次构建
concurrency:
  group: teknowra-deploy
  cancel-in-progress: true

env:
  REGISTRY_USER: liugl2025

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ env.REGISTRY_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.app
          push: true
          tags: |
            ${{ env.REGISTRY_USER }}/teknowra-app:latest
            ${{ env.REGISTRY_USER }}/teknowra-app:${{ github.sha }}
          # GitHub 跑在海外机器上，国内镜像源反而慢：全部留空走官方默认源
          build-args: |
            GOPROXY_ARG=
            APK_MIRROR_ARG=
            WITH_ANYDOC=1
            COMMIT_ID_ARG=${{ github.sha }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ env.REGISTRY_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY_USER }}/teknowra-ui:latest
            ${{ env.REGISTRY_USER }}/teknowra-ui:${{ github.sha }}
          build-args: |
            NPM_REGISTRY=
            VITE_FRONTEND_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=ui
          cache-to: type=gha,mode=max,scope=ui
