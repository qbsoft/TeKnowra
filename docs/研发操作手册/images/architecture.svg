<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1300" viewBox="0 0 1440 1300" role="img" aria-labelledby="title desc">
<title id="title">TeKnowra 企业 Agent 双引擎架构</title><desc id="desc">Casdoor提供平台OIDC和业务CAS认证，TeKnowra控制身份与资源，Langflow和Eino通过能力桥使用模型知识技能与本人MCP，CRM问数经AskGateway调用Wren；授权分析快照经MCP送入独立DoWhy计算环境。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#52677d"/></marker><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#23364a}.t{font-size:21px;font-weight:700}.s{font-size:16px}.small{font-size:14px}.box{fill:white;stroke:#b5c8d9;stroke-width:1.5;rx:12}.blue{fill:#edf5ff;stroke:#5c92cc}.green{fill:#eef9f4;stroke:#62a88a}.gold{fill:#fff8e9;stroke:#d0a754}.line{fill:none;stroke:#52677d;stroke-width:2;marker-end:url(#arrow)}.auth{stroke:#8c6bb8;stroke-dasharray:7 5}.label{fill:#4d647d;font-size:14px}</style></defs>
<rect width="1440" height="1300" fill="#f5f8fc"/>
<text x="40" y="40" font-size="28" font-weight="700">TeKnowra 企业 Agent 基础设施</text><text x="40" y="68" class="s">当前本机实现 · Langflow 默认 / Eino 按场景使用 · 2026-10-17</text>
<rect x="390" y="95" width="650" height="90" class="box gold"/><text x="415" y="127" class="t">Casdoor 统一身份认证</text><text x="415" y="155" class="s">平台：OIDC 登录　｜　业务授权：CAS → CRM 本人令牌</text><text x="415" y="176" class="small">确认“你是谁”；不直接授予知识库、CRM 数据或流程编辑权限</text>
<rect x="40" y="250" width="260" height="130" class="box"/><text x="60" y="285" class="t">研发人员</text><text x="60" y="318" class="s">TeKnowra 配资源、发布</text><text x="60" y="345" class="s">Langflow 画布 / Eino Go</text><text x="60" y="368" class="small">画布当前使用独立研发账号</text>
<rect x="390" y="250" width="650" height="130" class="box blue"/><text x="415" y="285" class="t">TeKnowra 平台与聊天入口</text><text x="415" y="317" class="s">员工 · 工作空间 · 角色 · Agent 共享 · 会话与附件解析</text><text x="415" y="345" class="s">任务生命周期 · 授权卡与恢复 · 固定版本 · 诊断与审计</text><text x="415" y="369" class="small">资源选择不是授权；每次执行仍检查当前人员和资源范围</text>
<rect x="1120" y="250" width="280" height="130" class="box"/><text x="1140" y="285" class="t">企业员工</text><text x="1140" y="318" class="s">在聊天中使用共享 Agent</text><text x="1140" y="345" class="s">上传本会话合同 / 本人授权</text>
<path d="M300 310H385" class="line"/><path d="M1120 310H1045" class="line"/><path d="M715 185V245" class="line auth"/><text x="726" y="220" class="label">OIDC → 平台会话</text>
<rect x="390" y="435" width="305" height="118" class="box blue"/><text x="410" y="470" class="t">Langflow 可视执行器</text><text x="410" y="501" class="s">私有草稿 → 固定发布工件</text><text x="410" y="528" class="s">工具 / 技能 / 受控专家组合</text>
<rect x="735" y="435" width="305" height="118" class="box blue"/><text x="755" y="470" class="t">Eino Go 执行器</text><text x="755" y="501" class="s">已编译场景图与实现指纹</text><text x="755" y="528" class="s">单次只读 / 合同信用多专家</text>
<path d="M542 380V430" class="line"/><path d="M887 380V430" class="line"/>
<rect x="390" y="610" width="650" height="112" class="box green"/><text x="415" y="646" class="t">TeKnowra 能力桥与现有资源服务</text><text x="415" y="677" class="s">绑定当前人 / 空间 / 会话 / 任务；重新检查权限与资源摘要</text><text x="415" y="702" class="s">仅 Langflow：会话文本附件、技能与受控脚本</text>
<path d="M542 553V605" class="line"/><path d="M887 553V605" class="line"/>
<rect x="40" y="610" width="260" height="180" class="box green"/><text x="60" y="645" class="t">平台资源</text><text x="60" y="677" class="s">模型：密钥留在平台</text><text x="60" y="705" class="s">知识：制度、文档及权限</text><text x="60" y="733" class="s">技能 / 沙箱：已审入口</text><text x="60" y="766" class="small">合同原件不自动进制度库</text><path d="M390 666H305" class="line"/>
<rect x="1120" y="610" width="280" height="112" class="box green"/><text x="1140" y="646" class="t">CRM MCP :8765</text><text x="1140" y="676" class="s">按人 OAuth，转发本人令牌</text><text x="1140" y="702" class="small">无令牌 → 聊天暂停并展示授权卡</text><path d="M1040 665H1115" class="line"/>
<path d="M1040 140H1418V588H1260V605" class="line auth"/><text x="1160" y="575" class="label">用户选择 CAS 统一账号</text>
<rect x="1120" y="790" width="280" height="118" class="box green"/><text x="1140" y="824" class="t">CRM / AskGateway</text><text x="1140" y="854" class="s">功能权限 + CrmScope 范围</text><text x="1140" y="881" class="small">CRM 签发本人业务令牌</text><text x="1140" y="901" class="small">ask_business → /askObject/ask</text><path d="M1260 722V785" class="line"/><text x="1272" y="761" class="label">本人业务调用</text>
<rect x="390" y="805" width="650" height="95" class="box"/><text x="415" y="840" class="t">持久化与运行保障</text><text x="415" y="871" class="s">平台数据库 / 文件　·　Langflow 发布元数据　·　OAuth 持久存储</text><text x="415" y="893" class="small">双引擎共享活动任务上限；历史保留；中断任务不自动重放</text><path d="M715 722V800" class="line"/>
<rect x="1120" y="965" width="280" height="112" class="box gold"/><text x="1140" y="999" class="t">Wren 语义查询</text><text x="1140" y="1027" class="s">模型 / 关系 / 指标 / 规则</text><text x="1140" y="1053" class="small">dry-plan → 受控只读查询</text><text x="1140" y="1073" class="small">业务结果按 Golden 与 truth 核对</text><path d="M1260 908V960" class="line"/>
<rect x="40" y="965" width="1000" height="112" class="box"/><text x="60" y="999" class="t">Wren 开发链：IDE + CLI 内置技能</text><text x="60" y="1030" class="s">generate-mdl 建结构 → enrich-context 审定口径 → validate/build → Golden → CRM 问数</text><text x="60" y="1059" class="small">wren-board 辅助业务审定与试问，不是员工真实 SSO 权限证明；不将数据库连接复制进 Langflow</text><path d="M1040 1020H1115" class="line"/>
<path d="M1260 1077V1135" class="line"/><text x="650" y="1120" class="label">经营分析：CRM 返回完整授权快照 → MCP 分析工具</text>
<rect x="390" y="1140" width="1010" height="115" class="box gold"/><text x="415" y="1175" class="t">MCP → 独立 DoWhy 计算环境</text><text x="415" y="1206" class="s">价量机制分解 · 限定模拟经营因果试点 · 不直接连接业务数据库</text><text x="415" y="1235" class="small">结果经 MCP 返回本人任务；不将机制分解或模拟结果当作已验证的真实经营根因</text>
</svg>
